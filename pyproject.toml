[project]
name = "documents-mcp-server"
version = "0.0.1"
description = "Self-hosted MCP server for document extraction and manipulation"
requires-python = "==3.14.*"
dependencies = [
    "mcp>=1.0,<2.0",
    # Reading. pypdfium2 for speed and rendering, pdfplumber for word boxes and
    # ruling lines, pikepdf for every structural operation. This trio is chosen
    # over the faster PyMuPDF deliberately: PyMuPDF is AGPL-3.0 and this stack
    # is permissive throughout. See docs/TECH_STACK.md §2 before changing it.
    "pypdfium2>=4.30,<5.0",
    "pdfplumber>=0.11,<1.0",
    "pikepdf>=9.0,<10.0",
    # Other formats. One reader per format, all normalising into engine/ir.py,
    # which is what keeps the tool count at 13 -- see docs/ARCHITECTURE.md §3.
    #
    # lxml floor is 6.1, not 5.x, and that is a Python 3.14 constraint rather
    # than an API one: 5.4.0 is the newest 5.x and it ships no cp314 wheel, so
    # uv falls back to building from source and dies on missing libxml2/libxslt
    # headers. The general trap -- checking a package's LATEST version for a
    # 3.14 wheel proves nothing about the version your pin actually selects.
    "lxml>=6.1,<7.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-pptx>=1.0,<2.0",
    "charset-normalizer>=3.3,<4.0",
]

# Deliberately absent, and not to be added without reading docs/TECH_STACK.md:
#   PyMuPDF / fitz     AGPL-3.0
#   ghostscript wheels AGPL-3.0
#   pdf2docx           licence unverified; needed only for pdf -> docx
#   ebooklib           believed AGPL-3.0; epub is a zip of XHTML, so lxml does it
#   unstructured / docling / any layout model -- model weights break offline
#   tabula-py -- requires a JVM
#
# Lock WITHOUT --upgrade. A sibling repo took a mystery TypeError in production
# when a transitive scipy bump changed what a string argument resolves to; the
# pin was right and the lock refresh was not.

# PEP 735 dependency groups, not [tool.uv] dev-dependencies. The six sibling
# repos all use the [tool.uv] form and uv now warns that it "is deprecated and
# will be removed in a future release" -- so the fleet has a small migration
# waiting for it. A new repo should not start inside the deprecation.
[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pyright>=1.1,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402"]

# shared/ is copied from the fleet and five of its files must stay byte-identical
# across seven repos. Running the formatter over them forks them silently -- and
# that is not hypothetical: MCP_File_System lints at line-length 100, so its copy
# of oauth_bridge.py differs from the other five by 77 lines of pure reflow and
# nothing else. Anyone diffing the two now has to read all 77 to learn that no
# fix is missing. Lint them (a real error is a real error); never rewrite them.
[tool.ruff.format]
exclude = ["shared/**"]

# Note for anyone adding type-checking config: a pyrightconfig.json OVERRIDES
# this table. Three sibling repos have one, and a stale pythonVersion in it cost
# a CI round -- ruff on py314 writes PEP 758's unparenthesised `except A, B:`,
# which a pyright pinned to 3.12 rejects as a syntax error. Do not create one.
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
